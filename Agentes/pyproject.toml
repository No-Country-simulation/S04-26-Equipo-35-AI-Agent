[project]
name = "conversa-crew"
version = "0.1.0"
description = "Sentiment and intent analysis system for ConversaAI"
requires-python = ">=3.12"

dependencies = [
    "litellm>=1.60.0",
    "pydantic>=2.0.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    # --- Bases de datos ---
    "supabase>=2.0.0",
    "qdrant-client>=1.9.0",
    "cohere>=5.0.0",
    # --- Queue / Workers ---
    "redis>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
