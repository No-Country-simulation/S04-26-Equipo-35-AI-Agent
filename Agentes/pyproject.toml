[project]
name = "conversa-crew"
version = "0.1.0"
description = "Sentiment and intent analysis system for ConversaAI"
requires-python = ">=3.12"

dependencies = [
    "crewai>=0.80.0",
    "crewai-tools>=0.15.0",
    "langchain-groq>=0.2.0",
    "pydantic>=2.0.0",
    "pandas>=2.2.0",
    "langdetect>=1.0.9",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
